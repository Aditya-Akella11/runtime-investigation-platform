version: '3.9'
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DisableHttpsRedirection=true
    depends_on:
      - mongodb
  demo-payment-api:
    build:
      context: ./demo/PaymentApi
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "4200:4200"
    command: sh -c "npm install && npm run start -- --host 0.0.0.0 --port 4200"
    depends_on:
      - api
      - demo-payment-api
  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
volumes:
  mongo-data: {}
